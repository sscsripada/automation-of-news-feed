name: Daily News Check-In

on:
  workflow_dispatch:
  schedule:
    - cron: "5 14 * 1,2,12 1-5"
    - cron: "5 13 8-31 3 1-5"
    - cron: "5 13 * 4-10 1-5"
    - cron: "5 13 1-6 11 1-5"
    - cron: "5 14 7-30 11 1-5"

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_USER_ID: U0AR58T5V40
      RECIPIENTS_CONFIG: config/recipients.csv
      WATCHLIST_CONFIG: config/watchlist.csv

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Generate check-in
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5-mini' }}
          NEWS_LOOKBACK_DAYS: ${{ vars.NEWS_LOOKBACK_DAYS || '2' }}
          NEWS_MAX_ARTICLES: ${{ vars.NEWS_MAX_ARTICLES || '5' }}
        run: generate-news-checkin --config "$WATCHLIST_CONFIG" --slack-output tmp/slack_payload.json

      - name: Commit and push check-in
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add checkins
          git diff --cached --quiet && exit 0
          git commit -m "docs: add daily news check-in for $(date -u +%F)"
          git push

      - name: Post digest to Slack DM
        if: ${{ env.SLACK_BOT_TOKEN != '' && (env.SLACK_USER_ID != '' || env.RECIPIENTS_CONFIG != '') }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5-mini' }}
          NEWS_LOOKBACK_DAYS: ${{ vars.NEWS_LOOKBACK_DAYS || '2' }}
          NEWS_MAX_ARTICLES: ${{ vars.NEWS_MAX_ARTICLES || '5' }}
        run: generate-news-checkin --config "$WATCHLIST_CONFIG" --recipients-config "$RECIPIENTS_CONFIG" --post-to-slack
