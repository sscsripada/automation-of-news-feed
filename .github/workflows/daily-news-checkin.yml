name: Daily News Check-In

on:
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * 1-5"

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Generate check-in
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5-mini' }}
          NEWS_LOOKBACK_DAYS: ${{ vars.NEWS_LOOKBACK_DAYS || '2' }}
          NEWS_MAX_ARTICLES: ${{ vars.NEWS_MAX_ARTICLES || '5' }}
        run: generate-news-checkin

      - name: Commit and push check-in
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add checkins
          git diff --cached --quiet && exit 0
          git commit -m "docs: add daily news check-in for $(date -u +%F)"
          git push
